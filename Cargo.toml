[workspace]
resolver = "2"
members = [
    "crates/kit-core",
    "crates/kit-solana",
    "crates/kit-mcp",
    "crates/kit-lean",
    "crates/kit-cli",
    "crates/kit-evm",
    "crates/kit-http",
]
# The default build (and the bar for `cargo check` / `cargo test`) is the
# core kit: core loop + Jev gate, Solana, MCP, Lean invariants, and the CLI.
# kit-evm and kit-http are in the workspace but opt-in builds.
default-members = [
    "crates/kit-core",
    "crates/kit-solana",
    "crates/kit-mcp",
    "crates/kit-lean",
    "crates/kit-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["OpenClawd contributors"]
homepage = "https://github.com/Solizardking/OpenClawd-agent-kit"
repository = "https://github.com/Solizardking/OpenClawd-agent-kit"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
base64 = "0.22"

# Keep build artifacts lean: this kit is developed on small machines and
# checked far more often than it is profiled.
[profile.dev]
debug = 0

[profile.test]
debug = 0
